name: Build and Release Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Delete previous release and tag using GitHub CLI
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release delete latest -y --repo ${{ github.repository }} || true
        git push origin --delete latest || true

    - name: Release Latest APK
      uses: softprops/action-gh-release@v1
      with:
        tag_name: latest
        name: "Pemutar Video Latest Release"
        body: "Automated latest build of Android Video Player APK."
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
